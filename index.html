<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UhhNo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

  :root {
    --phosphor: #39ff14;
    --phosphor-dim: #1a7a09;
    --phosphor-faint: #0d3d05;
    --bg: #050a04;
    --alert: #ff3a1a;
    --alert-glow: #ff3a1a88;
    --scanline: rgba(0,0,0,0.25);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--phosphor);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      var(--scanline) 2px,
      var(--scanline) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.75) 100%);
    pointer-events: none;
    z-index: 99;
  }

  #flash {
    position: fixed;
    inset: 0;
    background: var(--alert);
    opacity: 0;
    pointer-events: none;
    z-index: 98;
    mix-blend-mode: screen;
  }
  #flash.active {
    animation: flashOut 0.4s ease-out forwards;
  }
  @keyframes flashOut {
    0%   { opacity: 0.35; }
    100% { opacity: 0; }
  }

  #shell {
    width: min(720px, 95vw);
    border: 1px solid var(--phosphor-dim);
    padding: 2rem;
    position: relative;
    background: rgba(0,5,0,0.6);
    box-shadow: 0 0 20px #39ff1422, inset 0 0 40px rgba(0,0,0,0.5);
  }
  #shell.filler-hit {
    animation: borderFade 0.5s ease-out forwards;
  }
  @keyframes borderFade {
    0%   { border-color: var(--alert); box-shadow: 0 0 30px var(--alert-glow), inset 0 0 20px rgba(255,58,26,0.1); }
    100% { border-color: var(--phosphor-dim); box-shadow: 0 0 20px #39ff1422, inset 0 0 40px rgba(0,0,0,0.5); }
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 1.5rem;
    border-bottom: 1px solid var(--phosphor-faint);
    padding-bottom: 0.75rem;
  }

  h1 {
    font-family: 'VT323', monospace;
    font-size: 2rem;
    letter-spacing: 0.1em;
    text-shadow: 0 0 12px var(--phosphor);
  }

  #status-line {
    font-size: 0.7rem;
    color: var(--phosphor-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  #status-line span { color: var(--phosphor); }

  #transcript-box {
    min-height: 140px;
    max-height: 200px;
    overflow-y: auto;
    background: var(--phosphor-faint);
    border: 1px solid var(--phosphor-dim);
    padding: 0.75rem 1rem;
    font-size: 0.85rem;
    line-height: 1.7;
    color: var(--phosphor);
    margin-bottom: 1.25rem;
    scrollbar-width: thin;
    scrollbar-color: var(--phosphor-dim) transparent;
  }
  #transcript-box:empty::before {
    content: '> awaiting input...';
    color: var(--phosphor-dim);
    font-style: italic;
  }
  .filler-word {
    color: var(--alert);
    font-weight: bold;
    text-shadow: 0 0 8px var(--alert-glow);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .energy-hit {
    color: var(--alert);
    font-weight: bold;
    text-shadow: 0 0 8px var(--alert-glow);
    font-style: italic;
  }
  #cursor {
    display: inline-block;
    width: 0.55em;
    height: 1em;
    background: var(--phosphor);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  #stats {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 1.25rem;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    flex-wrap: wrap;
  }
  .stat { display: flex; flex-direction: column; gap: 0.2rem; }
  .stat-label { color: var(--phosphor-dim); text-transform: uppercase; font-size: 0.65rem; }
  .stat-value { font-family: 'VT323', monospace; font-size: 1.4rem; text-shadow: 0 0 8px var(--phosphor); }
  .stat-value.danger { color: var(--alert); text-shadow: 0 0 8px var(--alert-glow); }

  #last-filler {
    font-size: 0.7rem;
    color: var(--phosphor-dim);
    margin-bottom: 1.25rem;
    min-height: 1.1em;
    letter-spacing: 0.1em;
  }
  #last-filler span { color: var(--alert); text-shadow: 0 0 6px var(--alert-glow); }

  #energy-bar-wrap {
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  #energy-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--phosphor-dim);
    white-space: nowrap;
  }
  #energy-bar-track {
    flex: 1;
    height: 6px;
    background: var(--phosphor-faint);
    border: 1px solid var(--phosphor-dim);
    position: relative;
    overflow: visible;
  }
  #energy-bar-fill {
    height: 100%;
    width: 0%;
    background: var(--phosphor);
    transition: width 0.05s linear;
    box-shadow: 0 0 6px var(--phosphor);
  }
  #energy-bar-fill.hot {
    background: var(--alert);
    box-shadow: 0 0 6px var(--alert-glow);
  }
  #threshold-marker {
    position: absolute;
    top: -3px;
    height: 12px;
    width: 2px;
    background: var(--phosphor-dim);
    pointer-events: none;
  }

  #controls {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    flex-wrap: wrap;
  }

  button {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border: 1px solid var(--phosphor-dim);
    background: transparent;
    color: var(--phosphor);
    padding: 0.5rem 1.2rem;
    cursor: pointer;
    transition: all 0.1s;
  }
  button:hover { background: var(--phosphor-faint); border-color: var(--phosphor); box-shadow: 0 0 10px #39ff1444; }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.3; cursor: not-allowed; }

  #btn-start { border-color: var(--phosphor); box-shadow: 0 0 8px #39ff1433; }
  #btn-start.listening {
    color: var(--alert);
    border-color: var(--alert);
    box-shadow: 0 0 10px var(--alert-glow);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 6px var(--alert-glow); }
    50%       { box-shadow: 0 0 18px var(--alert-glow); }
  }

  #filler-editor {
    margin-top: 1.5rem;
    border-top: 1px solid var(--phosphor-faint);
    padding-top: 1rem;
    display: none;
  }
  #filler-editor.open { display: block; }
  #filler-editor > label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--phosphor-dim);
    display: block;
    margin-bottom: 0.4rem;
  }
  #filler-input {
    width: 100%;
    background: var(--phosphor-faint);
    border: 1px solid var(--phosphor-dim);
    color: var(--phosphor);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    padding: 0.4rem 0.6rem;
    outline: none;
    letter-spacing: 0.05em;
    margin-bottom: 1rem;
  }
  #filler-input:focus { border-color: var(--phosphor); }

  .setting-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.6rem;
  }
  .setting-row label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--phosphor-dim);
    flex: 1;
    white-space: nowrap;
  }
  .setting-row input[type=range] {
    flex: 1.5;
    accent-color: var(--phosphor);
  }
  .setting-row span {
    font-family: 'VT323', monospace;
    font-size: 1rem;
    color: var(--phosphor);
    min-width: 3em;
    text-align: right;
  }

  footer {
    margin-top: 1.5rem;
    font-size: 0.6rem;
    color: var(--phosphor-faint);
    letter-spacing: 0.1em;
    text-align: right;
  }

  #no-support {
    display: none;
    color: var(--alert);
    font-size: 0.85rem;
    margin-top: 1rem;
    text-shadow: 0 0 8px var(--alert-glow);
  }
</style>
</head>
<body>
<div id="flash"></div>

<div id="shell">
  <header>
    <h1>▌UhhNo</h1>
    <div id="status-line">STATUS: <span id="status-text">STANDBY</span></div>
  </header>

  <div id="transcript-box"><span id="cursor"></span></div>

  <div id="stats">
    <div class="stat">
      <span class="stat-label">Fillers</span>
      <span class="stat-value" id="count-fillers">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Words</span>
      <span class="stat-value" id="count-words">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Filler Rate</span>
      <span class="stat-value" id="count-rate">—</span>
    </div>
    <div class="stat">
      <span class="stat-label">Session</span>
      <span class="stat-value" id="count-time">0:00</span>
    </div>
  </div>

  <div id="energy-bar-wrap">
    <span id="energy-label">MIC</span>
    <div id="energy-bar-track">
      <div id="threshold-marker"></div>
      <div id="energy-bar-fill"></div>
    </div>
  </div>

  <div id="last-filler">LAST CATCH: <span id="last-word">—</span></div>

  <div id="controls">
    <button id="btn-start">⬤ START</button>
    <button id="btn-reset">↺ RESET</button>
    <button id="btn-edit">⚙ SETTINGS</button>
  </div>

  <div id="filler-editor">
    <label>Filler words (comma-separated)</label>
    <input type="text" id="filler-input" />

    <div class="setting-row">
      <label>Energy threshold</label>
      <input type="range" id="threshold-slider" min="1" max="50" value="12" step="1">
      <span id="threshold-val">12</span>
    </div>
    <div class="setting-row">
      <label>Min vocalization (ms)</label>
      <input type="range" id="duration-slider" min="100" max="800" value="300" step="50">
      <span id="duration-val">300ms</span>
    </div>
  </div>

  <div id="no-support">⚠ Speech recognition not supported. Try Chrome or Edge.</div>

  <footer>WEB SPEECH API + WEB AUDIO API // REAL-TIME ANALYSIS</footer>
</div>

<script>
  // ── Config ──────────────────────────────────────────────────────────────
  const DEFAULT_FILLERS = [
    'uh','um','uhh','umm','er','err','erm','like','you know','basically',
    'literally','actually','so','right','okay','well','sort of','kind of',
    'i mean','you know what i mean','honestly','obviously'
  ];

  let fillers = [...DEFAULT_FILLERS];
  let energyThreshold = 12;    // RMS (0–128) to consider voiced
  let minVocalizationMs = 300; // sustained duration before flagging

  // ── State ───────────────────────────────────────────────────────────────
  let recognition = null;
  let listening = false;
  let fillerCount = 0;
  let wordCount = 0;
  let sessionStart = null;
  let timerInterval = null;
  let fullTranscript = '';      // finalized HTML accumulator
  let lastFinalizedIndex = 0;  // dedup: highest result index we've processed

  // Energy detector
  let audioCtx = null;
  let analyser = null;
  let micStream = null;
  let energyBuffer = new Uint8Array(0);
  let energyRAF = null;
  let voicedSince = null;
  let silentSince = null;
  let energyLocked = false;
  const ENERGY_COOLDOWN_MS = 800;
  let lastTranscriptUpdate = 0; // timestamp of last finalized transcript chunk

  // ── DOM ─────────────────────────────────────────────────────────────────
  const flash           = document.getElementById('flash');
  const shell           = document.getElementById('shell');
  const transcriptBox   = document.getElementById('transcript-box');
  const cursor          = document.getElementById('cursor');
  const statusText      = document.getElementById('status-text');
  const btnStart        = document.getElementById('btn-start');
  const btnReset        = document.getElementById('btn-reset');
  const btnEdit         = document.getElementById('btn-edit');
  const fillerEditor    = document.getElementById('filler-editor');
  const fillerInput     = document.getElementById('filler-input');
  const countFillers    = document.getElementById('count-fillers');
  const countWords      = document.getElementById('count-words');
  const countRate       = document.getElementById('count-rate');
  const countTime       = document.getElementById('count-time');
  const lastWord        = document.getElementById('last-word');
  const noSupport       = document.getElementById('no-support');
  const energyFill      = document.getElementById('energy-bar-fill');
  const thresholdMarker = document.getElementById('threshold-marker');
  const thresholdSlider = document.getElementById('threshold-slider');
  const thresholdVal    = document.getElementById('threshold-val');
  const durationSlider  = document.getElementById('duration-slider');
  const durationVal     = document.getElementById('duration-val');

  fillerInput.value = fillers.join(', ');
  updateThresholdMarker();

  // ── Speech Recognition ──────────────────────────────────────────────────
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    noSupport.style.display = 'block';
    btnStart.disabled = true;
  } else {
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'en-US';
    recognition.maxAlternatives = 1;

    recognition.onresult = (event) => {
      let interimText = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const result = event.results[i];
        const text = result[0].transcript;
        if (result.isFinal) {
          if (i >= lastFinalizedIndex) {
            processFinalized(text);
            lastFinalizedIndex = i + 1;
          }
        } else {
          interimText += text;
        }
      }
      renderTranscript(interimText);
    };

    recognition.onerror = (e) => {
      if (e.error === 'not-allowed') {
        statusText.textContent = 'ERROR: MIC DENIED';
      } else if (e.error !== 'no-speech') {
        statusText.textContent = 'ERROR: ' + e.error.toUpperCase();
      }
    };

    recognition.onend = () => {
      if (listening) {
        lastFinalizedIndex = 0;
        recognition.start();
      }
    };
  }

  // ── Web Audio energy detector ───────────────────────────────────────────
  async function startAudio(stream) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.3;
    energyBuffer = new Uint8Array(analyser.frequencyBinCount);
    const source = audioCtx.createMediaStreamSource(stream);
    source.connect(analyser);
    energyLoop();
  }

  function energyLoop() {
    energyRAF = requestAnimationFrame(energyLoop);
    analyser.getByteTimeDomainData(energyBuffer);

    let sum = 0;
    for (let i = 0; i < energyBuffer.length; i++) {
      const v = energyBuffer[i] - 128;
      sum += v * v;
    }
    const rms = Math.sqrt(sum / energyBuffer.length);

    const pct = Math.min(100, (rms / 50) * 100);
    energyFill.style.width = pct + '%';
    energyFill.classList.toggle('hot', rms >= energyThreshold);

    if (!listening) return;

    const now = Date.now();

    if (rms >= energyThreshold) {
      silentSince = null;
      if (!voicedSince) voicedSince = now;
      if (!energyLocked && (now - voicedSince) >= minVocalizationMs) {
        energyLocked = true;
        voicedSince = null;
        setTimeout(() => { energyLocked = false; }, ENERGY_COOLDOWN_MS);
        onEnergyFiller();
      }
    } else {
      if (!silentSince) silentSince = now;
      if ((now - silentSince) > 150) voicedSince = null;
    }
  }

  function onEnergyFiller() {
    // Only fire if the transcript hasn't produced words recently —
    // meaning this is a vocalization the engine dropped, not a real word.
    if (Date.now() - lastTranscriptUpdate < 600) return;

    fillerCount++;
    lastWord.textContent = '[VOCALIZATION]';
    fullTranscript += (fullTranscript ? ' ' : '') + '<span class="energy-hit">[uhh]</span>';
    triggerAlert();
    updateStats();
    renderTranscript('');
  }

  function stopAudio() {
    if (energyRAF) { cancelAnimationFrame(energyRAF); energyRAF = null; }
    if (audioCtx)  { audioCtx.close(); audioCtx = null; }
    analyser = null;
    energyFill.style.width = '0%';
    voicedSince = null;
    silentSince = null;
    energyLocked = false;
  }

  // ── Text processing ─────────────────────────────────────────────────────
  function getSortedFillers() {
    return [...fillers].sort((a, b) => b.length - a.length);
  }

  function highlightFillers(text) {
    let result = text;
    for (const filler of getSortedFillers()) {
      const escaped = filler.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp(`\\b(${escaped})\\b`, 'gi');
      result = result.replace(re, `<span class="filler-word">$1</span>`);
    }
    return result;
  }

  function countWordsIn(text) {
    return text.trim().split(/\s+/).filter(w => w.length > 0).length;
  }

  function detectFillers(text) {
    const hits = [];
    for (const filler of getSortedFillers()) {
      const escaped = filler.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp(`\\b(${escaped})\\b`, 'gi');
      let m;
      while ((m = re.exec(text)) !== null) hits.push(m[0]);
    }
    return hits;
  }

  function processFinalized(text) {
    lastTranscriptUpdate = Date.now();
    const hits = detectFillers(text);
    wordCount += countWordsIn(text);
    fullTranscript += (fullTranscript ? ' ' : '') + highlightFillers(text.trim());

    if (hits.length > 0) {
      fillerCount += hits.length;
      lastWord.textContent = hits[hits.length - 1].toUpperCase();
      triggerAlert();
    }
    updateStats();
    renderTranscript('');
  }

  function renderTranscript(interim) {
    const interimHL = interim ? highlightFillers(interim) : '';
    transcriptBox.innerHTML =
      (fullTranscript ? fullTranscript + ' ' : '') +
      (interimHL ? `<span style="opacity:0.5">${interimHL}</span> ` : '') +
      cursor.outerHTML;
    transcriptBox.scrollTop = transcriptBox.scrollHeight;
  }

  // ── Alert ───────────────────────────────────────────────────────────────
  function triggerAlert() {
    flash.classList.remove('active');
    shell.classList.remove('filler-hit');
    void flash.offsetWidth;
    flash.classList.add('active');
    shell.classList.add('filler-hit');
  }

  // ── Stats ───────────────────────────────────────────────────────────────
  function updateStats() {
    countFillers.textContent = fillerCount;
    countFillers.classList.toggle('danger', fillerCount > 0);
    countWords.textContent = wordCount;
    if (wordCount > 0) {
      const rate = ((fillerCount / wordCount) * 100).toFixed(1);
      countRate.textContent = rate + '%';
      countRate.classList.toggle('danger', parseFloat(rate) > 5);
    } else {
      countRate.textContent = '—';
    }
  }

  function updateTimer() {
    if (!sessionStart) return;
    const secs = Math.floor((Date.now() - sessionStart) / 1000);
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    countTime.textContent = `${m}:${s.toString().padStart(2,'0')}`;
  }

  function updateThresholdMarker() {
    const pct = Math.min(100, (energyThreshold / 50) * 100);
    thresholdMarker.style.left = pct + '%';
  }

  // ── Controls ─────────────────────────────────────────────────────────────
  btnStart.addEventListener('click', async () => {
    if (!recognition) return;

    if (!listening) {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        statusText.textContent = 'ERROR: MIC DENIED';
        return;
      }
      await startAudio(micStream);
      listening = true;
      lastFinalizedIndex = 0;
      recognition.start();
      statusText.textContent = 'MONITORING';
      btnStart.textContent = '◼ STOP';
      btnStart.classList.add('listening');
      sessionStart = sessionStart || Date.now();
      timerInterval = timerInterval || setInterval(updateTimer, 500);
    } else {
      listening = false;
      recognition.stop();
      stopAudio();
      statusText.textContent = 'PAUSED';
      btnStart.textContent = '⬤ START';
      btnStart.classList.remove('listening');
    }
  });

  btnReset.addEventListener('click', () => {
    if (listening) {
      listening = false;
      recognition.stop();
      stopAudio();
      btnStart.textContent = '⬤ START';
      btnStart.classList.remove('listening');
    }
    fullTranscript = '';
    fillerCount = 0;
    wordCount = 0;
    sessionStart = null;
    lastFinalizedIndex = 0;
    lastTranscriptUpdate = 0;
    clearInterval(timerInterval);
    timerInterval = null;
    lastWord.textContent = '—';
    statusText.textContent = 'STANDBY';
    countTime.textContent = '0:00';
    updateStats();
    transcriptBox.innerHTML = cursor.outerHTML;
  });

  btnEdit.addEventListener('click', () => {
    fillerEditor.classList.toggle('open');
  });

  fillerInput.addEventListener('input', () => {
    fillers = fillerInput.value
      .split(',')
      .map(s => s.trim().toLowerCase())
      .filter(s => s.length > 0);
  });

  thresholdSlider.addEventListener('input', () => {
    energyThreshold = parseInt(thresholdSlider.value);
    thresholdVal.textContent = energyThreshold;
    updateThresholdMarker();
  });

  durationSlider.addEventListener('input', () => {
    minVocalizationMs = parseInt(durationSlider.value);
    durationVal.textContent = durationSlider.value + 'ms';
  });
</script>
</body>
</html>
