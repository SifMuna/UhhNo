<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FILLER DETECTOR</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

  :root {
    --phosphor: #39ff14;
    --phosphor-dim: #1a7a09;
    --phosphor-faint: #0d3d05;
    --bg: #050a04;
    --alert: #ff3a1a;
    --alert-glow: #ff3a1a88;
    --scanline: rgba(0,0,0,0.25);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--phosphor);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* CRT scanlines */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      var(--scanline) 2px,
      var(--scanline) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* CRT vignette */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.75) 100%);
    pointer-events: none;
    z-index: 99;
  }

  /* Screen flash overlay */
  #flash {
    position: fixed;
    inset: 0;
    background: var(--alert);
    opacity: 0;
    pointer-events: none;
    z-index: 98;
    mix-blend-mode: screen;
    transition: opacity 0.05s;
  }
  #flash.active {
    opacity: 0.35;
    animation: flashOut 0.4s ease-out forwards;
  }
  @keyframes flashOut {
    0%   { opacity: 0.35; }
    100% { opacity: 0; }
  }

  /* Border pulse on filler */
  #shell {
    width: min(720px, 95vw);
    border: 1px solid var(--phosphor-dim);
    padding: 2rem;
    position: relative;
    background: rgba(0,5,0,0.6);
    box-shadow: 0 0 20px #39ff1422, inset 0 0 40px rgba(0,0,0,0.5);
    transition: border-color 0.1s, box-shadow 0.1s;
  }
  #shell.filler-hit {
    border-color: var(--alert);
    box-shadow: 0 0 30px var(--alert-glow), inset 0 0 20px rgba(255,58,26,0.1);
    animation: borderFade 0.5s ease-out forwards;
  }
  @keyframes borderFade {
    0%   { border-color: var(--alert); box-shadow: 0 0 30px var(--alert-glow), inset 0 0 20px rgba(255,58,26,0.1); }
    100% { border-color: var(--phosphor-dim); box-shadow: 0 0 20px #39ff1422, inset 0 0 40px rgba(0,0,0,0.5); }
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 1.5rem;
    border-bottom: 1px solid var(--phosphor-faint);
    padding-bottom: 0.75rem;
  }

  h1 {
    font-family: 'VT323', monospace;
    font-size: 2rem;
    letter-spacing: 0.1em;
    text-shadow: 0 0 12px var(--phosphor);
  }

  #status-line {
    font-size: 0.7rem;
    color: var(--phosphor-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  #status-line span { color: var(--phosphor); }

  /* Transcript area */
  #transcript-box {
    min-height: 140px;
    max-height: 200px;
    overflow-y: auto;
    background: var(--phosphor-faint);
    border: 1px solid var(--phosphor-dim);
    padding: 0.75rem 1rem;
    font-size: 0.85rem;
    line-height: 1.7;
    color: var(--phosphor);
    margin-bottom: 1.25rem;
    position: relative;
    scrollbar-width: thin;
    scrollbar-color: var(--phosphor-dim) transparent;
  }
  #transcript-box:empty::before {
    content: '> awaiting input...';
    color: var(--phosphor-dim);
    font-style: italic;
  }
  .filler-word {
    color: var(--alert);
    font-weight: bold;
    text-shadow: 0 0 8px var(--alert-glow);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  /* blinking cursor */
  #cursor {
    display: inline-block;
    width: 0.55em;
    height: 1em;
    background: var(--phosphor);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Stats row */
  #stats {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 1.25rem;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
  }
  .stat {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }
  .stat-label { color: var(--phosphor-dim); text-transform: uppercase; font-size: 0.65rem; }
  .stat-value { font-family: 'VT323', monospace; font-size: 1.4rem; text-shadow: 0 0 8px var(--phosphor); }
  .stat-value.danger { color: var(--alert); text-shadow: 0 0 8px var(--alert-glow); }

  /* Last filler indicator */
  #last-filler {
    font-size: 0.7rem;
    color: var(--phosphor-dim);
    margin-bottom: 1.5rem;
    min-height: 1.1em;
    letter-spacing: 0.1em;
  }
  #last-filler span { color: var(--alert); text-shadow: 0 0 6px var(--alert-glow); }

  /* Controls */
  #controls {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    flex-wrap: wrap;
  }

  button {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border: 1px solid var(--phosphor-dim);
    background: transparent;
    color: var(--phosphor);
    padding: 0.5rem 1.2rem;
    cursor: pointer;
    transition: all 0.1s;
    position: relative;
  }
  button:hover {
    background: var(--phosphor-faint);
    border-color: var(--phosphor);
    box-shadow: 0 0 10px #39ff1444;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.3; cursor: not-allowed; }

  #btn-start {
    border-color: var(--phosphor);
    box-shadow: 0 0 8px #39ff1433;
  }
  #btn-start.listening {
    color: var(--alert);
    border-color: var(--alert);
    box-shadow: 0 0 10px var(--alert-glow);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 6px var(--alert-glow); }
    50%       { box-shadow: 0 0 18px var(--alert-glow); }
  }

  /* Filler word editor */
  #filler-editor {
    margin-top: 1.5rem;
    border-top: 1px solid var(--phosphor-faint);
    padding-top: 1rem;
    display: none;
  }
  #filler-editor.open { display: block; }
  #filler-editor label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--phosphor-dim);
    display: block;
    margin-bottom: 0.4rem;
  }
  #filler-input {
    width: 100%;
    background: var(--phosphor-faint);
    border: 1px solid var(--phosphor-dim);
    color: var(--phosphor);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    padding: 0.4rem 0.6rem;
    outline: none;
    letter-spacing: 0.05em;
  }
  #filler-input:focus { border-color: var(--phosphor); }

  footer {
    margin-top: 1.5rem;
    font-size: 0.6rem;
    color: var(--phosphor-faint);
    letter-spacing: 0.1em;
    text-align: right;
  }

  /* no support message */
  #no-support {
    display: none;
    color: var(--alert);
    font-size: 0.85rem;
    margin-top: 1rem;
    text-shadow: 0 0 8px var(--alert-glow);
  }
</style>
</head>
<body>
<div id="flash"></div>

<div id="shell">
  <header>
    <h1>▌FILLER DETECTOR</h1>
    <div id="status-line">STATUS: <span id="status-text">STANDBY</span></div>
  </header>

  <div id="transcript-box"><span id="cursor"></span></div>

  <div id="stats">
    <div class="stat">
      <span class="stat-label">Fillers</span>
      <span class="stat-value" id="count-fillers">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Words</span>
      <span class="stat-value" id="count-words">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Filler Rate</span>
      <span class="stat-value" id="count-rate">—</span>
    </div>
    <div class="stat">
      <span class="stat-label">Session</span>
      <span class="stat-value" id="count-time">0:00</span>
    </div>
  </div>

  <div id="last-filler">LAST CATCH: <span id="last-word">—</span></div>

  <div id="controls">
    <button id="btn-start">⬤ START</button>
    <button id="btn-reset">↺ RESET</button>
    <button id="btn-edit">⚙ FILLERS</button>
  </div>

  <div id="filler-editor">
    <label>Filler words (comma-separated)</label>
    <input type="text" id="filler-input" />
  </div>

  <div id="no-support">⚠ Speech recognition not supported in this browser. Try Chrome or Edge.</div>

  <footer>WEB SPEECH API // REAL-TIME TRANSCRIPT ANALYSIS</footer>
</div>

<script>
  const DEFAULT_FILLERS = ['uh','um','uhh','umm','er','err','like','you know','basically','literally','actually','so','right','okay','well','sort of','kind of','i mean','you know what i mean','honestly','i think','i feel','i believe','basically','essentially','literally','actually','really','just','surely','certainly','absolutely','definitely','clearly','obviously'];

  let fillers = [...DEFAULT_FILLERS];
  let recognition = null;
  let listening = false;
  let fillerCount = 0;
  let wordCount = 0;
  let sessionStart = null;
  let timerInterval = null;
  let fullTranscript = ''; // accumulated finalized text

  const flash       = document.getElementById('flash');
  const shell       = document.getElementById('shell');
  const transcriptBox = document.getElementById('transcript-box');
  const cursor      = document.getElementById('cursor');
  const statusText  = document.getElementById('status-text');
  const btnStart    = document.getElementById('btn-start');
  const btnReset    = document.getElementById('btn-reset');
  const btnEdit     = document.getElementById('btn-edit');
  const fillerEditor = document.getElementById('filler-editor');
  const fillerInput = document.getElementById('filler-input');
  const countFillers = document.getElementById('count-fillers');
  const countWords   = document.getElementById('count-words');
  const countRate    = document.getElementById('count-rate');
  const countTime    = document.getElementById('count-time');
  const lastWord     = document.getElementById('last-word');
  const noSupport    = document.getElementById('no-support');

  fillerInput.value = fillers.join(', ');

  // ── Speech Recognition setup ──────────────────────────────────────────
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    noSupport.style.display = 'block';
    btnStart.disabled = true;
  } else {
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'en-US';

    recognition.onresult = (event) => {
      let interimText = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const result = event.results[i];
        const transcript = result[0].transcript;
        if (result.isFinal) {
          processFinalized(transcript);
        } else {
          interimText += transcript;
        }
      }
      renderTranscript(interimText);
    };

    recognition.onerror = (e) => {
      if (e.error !== 'no-speech') {
        statusText.textContent = 'ERROR: ' + e.error.toUpperCase();
      }
    };

    recognition.onend = () => {
      if (listening) recognition.start(); // auto-restart
    };
  }

  // ── Text processing ───────────────────────────────────────────────────
  function getSortedFillers() {
    // Sort longest first so multi-word phrases match before subwords
    return [...fillers].sort((a, b) => b.length - a.length);
  }

  function highlightFillers(text) {
    let result = text;
    const sorted = getSortedFillers();
    for (const filler of sorted) {
      const escaped = filler.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp(`\\b(${escaped})\\b`, 'gi');
      result = result.replace(re, `<span class="filler-word">$1</span>`);
    }
    return result;
  }

  function countWordsIn(text) {
    return text.trim().split(/\s+/).filter(w => w.length > 0).length;
  }

  function detectFillers(text) {
    const sorted = getSortedFillers();
    let hits = [];
    for (const filler of sorted) {
      const escaped = filler.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp(`\\b(${escaped})\\b`, 'gi');
      let m;
      while ((m = re.exec(text)) !== null) hits.push(m[0]);
    }
    return hits;
  }

  function processFinalized(text) {
    fullTranscript += (fullTranscript ? ' ' : '') + text.trim();
    const hits = detectFillers(text);
    wordCount += countWordsIn(text);

    if (hits.length > 0) {
      fillerCount += hits.length;
      lastWord.textContent = hits[hits.length - 1].toUpperCase();
      triggerAlert();
    }
    updateStats();
    renderTranscript('');
  }

  function renderTranscript(interim) {
    const highlighted = highlightFillers(fullTranscript);
    const interimHighlighted = highlightFillers(interim);
    transcriptBox.innerHTML =
      (highlighted ? highlighted + ' ' : '') +
      (interimHighlighted ? `<span style="opacity:0.5">${interimHighlighted}</span> ` : '') +
      cursor.outerHTML;
    transcriptBox.scrollTop = transcriptBox.scrollHeight;
  }

  // ── Alert ────────────────────────────────────────────────────────────
  function triggerAlert() {
    flash.classList.remove('active');
    shell.classList.remove('filler-hit');
    void flash.offsetWidth; // reflow to restart animation
    flash.classList.add('active');
    shell.classList.add('filler-hit');
  }

  // ── Stats ────────────────────────────────────────────────────────────
  function updateStats() {
    countFillers.textContent = fillerCount;
    countFillers.classList.toggle('danger', fillerCount > 0);
    countWords.textContent = wordCount;
    if (wordCount > 0) {
      const rate = ((fillerCount / wordCount) * 100).toFixed(1);
      countRate.textContent = rate + '%';
      countRate.classList.toggle('danger', parseFloat(rate) > 5);
    } else {
      countRate.textContent = '—';
    }
  }

  function updateTimer() {
    if (!sessionStart) return;
    const secs = Math.floor((Date.now() - sessionStart) / 1000);
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    countTime.textContent = `${m}:${s.toString().padStart(2,'0')}`;
  }

  // ── Controls ──────────────────────────────────────────────────────────
  btnStart.addEventListener('click', () => {
    if (!recognition) return;
    if (!listening) {
      listening = true;
      recognition.start();
      statusText.textContent = 'MONITORING';
      btnStart.textContent = '◼ STOP';
      btnStart.classList.add('listening');
      sessionStart = sessionStart || Date.now();
      timerInterval = timerInterval || setInterval(updateTimer, 500);
    } else {
      listening = false;
      recognition.stop();
      statusText.textContent = 'PAUSED';
      btnStart.textContent = '⬤ START';
      btnStart.classList.remove('listening');
    }
  });

  btnReset.addEventListener('click', () => {
    if (listening) {
      listening = false;
      recognition.stop();
      btnStart.textContent = '⬤ START';
      btnStart.classList.remove('listening');
    }
    fullTranscript = '';
    fillerCount = 0;
    wordCount = 0;
    sessionStart = null;
    clearInterval(timerInterval);
    timerInterval = null;
    lastWord.textContent = '—';
    statusText.textContent = 'STANDBY';
    countTime.textContent = '0:00';
    updateStats();
    transcriptBox.innerHTML = cursor.outerHTML;
  });

  btnEdit.addEventListener('click', () => {
    fillerEditor.classList.toggle('open');
  });

  fillerInput.addEventListener('input', () => {
    fillers = fillerInput.value
      .split(',')
      .map(s => s.trim().toLowerCase())
      .filter(s => s.length > 0);
  });
</script>
</body>
</html>
